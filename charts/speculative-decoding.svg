<text x="50" y="84" fill="#aab8cc" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="500" text-anchor="start">Matched comparisons within each model and instrument.</text>
<rect x="40" y="125" width="350" height="400" rx="16" fill="#111d30"/>
<text x="60" y="159" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="750" text-anchor="start">Qwen · C1</text>
<rect x="112" y="304.7" width="82" height="150.3" rx="8" fill="#aab8cc"/>
<text x="153.0" y="292.6894117647059" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" text-anchor="middle">49.14</text>
