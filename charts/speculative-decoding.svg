<text x="215.0" y="505" fill="#fbbf24" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" text-anchor="middle">+41.49% · 86.0% accepted</text>
<rect x="425" y="125" width="350" height="400" rx="16" fill="#111d30"/>
<text x="445" y="159" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="750" text-anchor="start">Qwen · C8 aggregate</text>
