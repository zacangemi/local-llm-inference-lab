<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Speculative decoding uplift</title>
<desc id="desc">Qwen and Step parent versus MTP throughput in separately scaled panels.</desc>
<rect width="1200" height="650" rx="24" fill="#08111f"/>
